apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /api
      - /ascii
      - /img
      - /ml5
      - /models
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-demo-app
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-strip-prefix@kubernetescrd
spec:
  rules:
    - host: demo.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: go-demo-app-api
                port:
                  number: 80
          - path: /ascii
            pathType: Prefix
            backend:
              service:
                name: go-demo-app-ascii
                port:
                  number: 80
          - path: /img
            pathType: Prefix
            backend:
              service:
                name: go-demo-app-img
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-demo-app-front
                port:
                  number: 80
          - path: /ml5
            pathType: Prefix
            backend:
              service:
                name: demo-ml5
                port:
                  number: 80
          - path: /models
            pathType: Prefix
            backend:
              service:
                name: demo-ml5
                port:
                  number: 80                  